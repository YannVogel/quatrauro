<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Météo — Accueil Nice sous la pluie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
[data-theme="light"]{--bg:#EAF4FF;--hero:#3A4F7A;--card:#FFFFFF;--fg:#0B1B3A;--mu:#4A5B7C;--track:#DCE8F7;--bar:#1463FF;--sun:#FFC93C;--pale:#DCE8F7}
[data-theme="dark"]{--bg:#071226;--hero:#2A3A5E;--card:#0F1E3D;--fg:#EAF1FF;--mu:#A9B8D6;--track:#1C2E55;--bar:#7FB0FF;--sun:#FFC93C;--pale:#DCE8F7}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); color: var(--fg); font-family: 'Outfit', system-ui, sans-serif">

<div style="background: var(--hero); color: #FFFFFF; border-radius: 28px; padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; gap: 6px; background: rgba(255,255,255,0.16); border-radius: 22px; padding: 0">
<a href="riviera-accueil.dc.html" style="height: 44px; padding: 0 18px; border-radius: 22px; display: flex; align-items: center; color: #FFFFFF; font-size: 15px; font-weight: 500">Toulon</a>
<button aria-pressed="true" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #FFFFFF; color: #0B1B3A; font-size: 15px; font-weight: 600">Nice</button>
</div>
<button aria-label="Basculer entre thème clair et sombre" onClick="{{toggle}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" style="fill: currentColor"></path></svg>
</button>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 108px; font-weight: 700; line-height: 0.95; letter-spacing: -0.04em">14°</div>
<div style="font-size: 22px; font-weight: 600">Averses</div>
<div style="font-size: 15px">Mardi 17 novembre · vent 12 km/h</div>
</div>
<div style="width: 112px; height: 112px; border-radius: 56px; background: var(--pale); display: flex; align-items: center; justify-content: center; color: #0B1B3A">
<svg width="60" height="60" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 15h10a4 4 0 0 0 .5-8A6 6 0 0 0 5.9 8.5 3.5 3.5 0 0 0 7 15zM8 18v3M12 18v3M16 18v3"></path></svg>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<div style="background: var(--sun); color: #0B1B3A; border-radius: 16px; padding: 6px 14px; font-size: 14px; font-weight: 600">Fiabilité 70 %</div>
<div style="font-size: 14px">3 modèles sur 4 d'accord</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<div style="background: var(--card); border-radius: 18px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 13px; color: var(--mu)">17 h</div><div style="font-size: 20px; font-weight: 600">14°</div><div style="font-size: 12px; color: var(--mu)">80 %</div></div>
<div style="background: var(--card); border-radius: 18px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 13px; color: var(--mu)">18 h</div><div style="font-size: 20px; font-weight: 600">13°</div><div style="font-size: 12px; color: var(--mu)">70 %</div></div>
<div style="background: var(--card); border-radius: 18px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 13px; color: var(--mu)">19 h</div><div style="font-size: 20px; font-weight: 600">13°</div><div style="font-size: 12px; color: var(--mu)">40 %</div></div>
<div style="background: var(--card); border-radius: 18px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 13px; color: var(--mu)">20 h</div><div style="font-size: 20px; font-weight: 600">12°</div><div style="font-size: 12px; color: var(--mu)">20 %</div></div>
<div style="background: var(--card); border-radius: 18px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 13px; color: var(--mu)">21 h</div><div style="font-size: 20px; font-weight: 600">12°</div><div style="font-size: 12px; color: var(--mu)">10 %</div></div>
</div>

<div style="background: var(--card); border-radius: 28px; padding: 8px 18px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Averses" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 15h10a4 4 0 0 0 .5-8A6 6 0 0 0 5.9 8.5 3.5 3.5 0 0 0 7 15zM8 18v3M12 18v3M16 18v3"></path></svg>
<div style="font-weight: 600">Mar.</div><div style="color: var(--mu); text-align: right">10°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 43%; width: 29%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">14°</div><div style="font-size: 13px; color: var(--mu); text-align: right">70 %</div>
</div>
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Éclaircies" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.5A3.5 3.5 0 0 0 7 18z"></path></svg>
<div style="font-weight: 600">Mer.</div><div style="color: var(--mu); text-align: right">10°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 43%; width: 43%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">16°</div><div style="font-size: 13px; color: var(--mu); text-align: right">85 %</div>
</div>
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Pluie" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 15h10a4 4 0 0 0 .5-8A6 6 0 0 0 5.9 8.5 3.5 3.5 0 0 0 7 15zM8 18v3M12 18v3M16 18v3"></path></svg>
<div style="font-weight: 600">Jeu.</div><div style="color: var(--mu); text-align: right">11°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 50%; width: 21%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">14°</div><div style="font-size: 13px; color: var(--mu); text-align: right">80 %</div>
</div>
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Soleil" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
<div style="font-weight: 600">Ven.</div><div style="color: var(--mu); text-align: right">8°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 29%; width: 50%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">15°</div><div style="font-size: 13px; color: var(--mu); text-align: right">65 %</div>
</div>
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Soleil" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
<div style="font-weight: 600">Sam.</div><div style="color: var(--mu); text-align: right">6°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 14%; width: 57%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">14°</div><div style="font-size: 13px; color: var(--mu); text-align: right">60 %</div>
</div>
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Voilé" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.5A3.5 3.5 0 0 0 7 18z"></path></svg>
<div style="font-weight: 600">Dim.</div><div style="color: var(--mu); text-align: right">7°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 21%; width: 50%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">14°</div><div style="font-size: 13px; color: var(--mu); text-align: right">45 %</div>
</div>
<div style="display: grid; grid-template-columns: 24px 40px 28px 1fr 28px 44px; align-items: center; column-gap: 8px; height: 40px; font-size: 15px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" role="img" aria-label="Pluie" style="stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 15h10a4 4 0 0 0 .5-8A6 6 0 0 0 5.9 8.5 3.5 3.5 0 0 0 7 15zM8 18v3M12 18v3M16 18v3"></path></svg>
<div style="font-weight: 600">Lun.</div><div style="color: var(--mu); text-align: right">9°</div>
<div style="height: 8px; background: var(--track); border-radius: 4px"><div style="margin-left: 36%; width: 36%; height: 8px; background: var(--bar); border-radius: 4px"></div></div>
<div style="font-weight: 600">14°</div><div style="font-size: 13px; color: var(--mu); text-align: right">30 %</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidUpdate(prev) {
if (prev.dark !== this.props.dark && this.state && this.state.dark != null) this.setState({ dark: null });
}
renderVals() {
const s = this.state ? this.state.dark : null;
const dark = s == null ? (this.props.dark ?? false) : s;
return { theme: dark ? 'dark' : 'light', toggle: () => this.setState({ dark: !dark }) };
}
}
</script>
</body>
</html>
